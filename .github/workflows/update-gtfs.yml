name: Refresh Dankal GTFS Feeder Graph

on:
  schedule:
    # Run every Sunday and Wednesday at 03:00 UTC (05:00/06:00 Israel time)
    - cron: '0 3 * * 0,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gtfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild dankal_data.json from official MoT GTFS
        run: python3 scripts/build_dankal_graph.py

      - name: Commit and push updated dataset if changed
        run: |
          if [ -n "$(git status --porcelain src/data/dankal_data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/dankal_data.json
            git commit -m "chore(gtfs): refresh Dankal feeder graph & timetables"
            git push
          else
            echo "No changes in GTFS data."
          fi
